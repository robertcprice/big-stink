<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Ocean - 3D Perspective</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #ocean {
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    line-height: 1.1;
    white-space: pre;
    letter-spacing: 1px;
    user-select: none;
  }
</style>
</head>
<body>
<div id="ocean"></div>
<script>
const COLS = 120;
const ROWS = 50;
const el = document.getElementById('ocean');

const HORIZON = Math.floor(ROWS * 0.38);
const CAM_HEIGHT = 3.0;
const FOCAL = 60.0;

// Wave height function - multiple octaves of sine for realism
function waveHeight(wx, wz, t) {
  let h = 0;
  // Primary swell - long rolling waves coming towards viewer
  h += Math.sin(wz * 0.4 + t * 0.8) * 1.0;
  h += Math.sin(wz * 0.15 + wx * 0.05 + t * 0.5) * 0.6;
  // Cross waves
  h += Math.sin(wx * 0.3 + wz * 0.2 - t * 0.6) * 0.35;
  h += Math.sin(wx * 0.12 - t * 0.3) * 0.2;
  // High-frequency chop
  h += Math.sin(wx * 0.8 + wz * 0.9 + t * 1.5) * 0.15;
  h += Math.sin(wx * 1.5 - wz * 0.7 + t * 2.0) * 0.08;
  return h;
}

// Derivative for "slope" (used for lighting/char selection)
function waveSlope(wx, wz, t) {
  const eps = 0.3;
  const hL = waveHeight(wx - eps, wz, t);
  const hR = waveHeight(wx + eps, wz, t);
  const hF = waveHeight(wx, wz - eps, t);
  const hB = waveHeight(wx, wz + eps, t);
  return { dx: (hR - hL) / (2 * eps), dz: (hB - hF) / (2 * eps) };
}

function lerp(a, b, t) { return a + (b - a) * Math.max(0, Math.min(1, t)); }

function lerpColor(c1, c2, t) {
  t = Math.max(0, Math.min(1, t));
  return [
    Math.round(lerp(c1[0], c2[0], t)),
    Math.round(lerp(c1[1], c2[1], t)),
    Math.round(lerp(c1[2], c2[2], t))
  ];
}

// Sky gradient colors [r,g,b]
const SKY_TOP    = [5, 5, 20];
const SKY_MID    = [15, 20, 50];
const SKY_HORIZ  = [40, 55, 85];

// Water color palette
const WATER_DEEP   = [8, 30, 60];
const WATER_MID    = [20, 70, 120];
const WATER_LIGHT  = [50, 140, 200];
const WATER_BRIGHT = [100, 190, 240];
const FOAM_COLOR   = [210, 235, 250];
const WHITE        = [255, 255, 255];

// Characters by "energy" / slope
const FLAT_CHARS    = [' ', ' ', '.', '·', ' ', '.'];
const GENTLE_CHARS  = ['~', '~', '-', '~', '≈', '-'];
const MEDIUM_CHARS  = ['≈', '∿', '~', '≈', '∽', '≋'];
const STEEP_CHARS   = ['▓', '▒', '░', '█', '▓', '▒'];
const CREST_CHARS   = ["'", '"', '`', '^', '°', '*'];
const FOAM_CHARS    = ['░', '▒', '·', ':', '.', "'"];

let t = 0;

function render(time) {
  let html = '';

  for (let row = 0; row < ROWS; row++) {
    let lineChars = [];

    if (row <= HORIZON) {
      // === SKY ===
      const skyT = row / HORIZON;
      let skyColor;
      if (skyT < 0.5) {
        skyColor = lerpColor(SKY_TOP, SKY_MID, skyT * 2);
      } else {
        skyColor = lerpColor(SKY_MID, SKY_HORIZ, (skyT - 0.5) * 2);
      }

      for (let col = 0; col < COLS; col++) {
        let ch = ' ';
        let color = skyColor;

        // Stars
        const starSeed = Math.sin(col * 127.1 + row * 311.7) * 43758.5453;
        const starVal = starSeed - Math.floor(starSeed);
        if (starVal > 0.992 && skyT < 0.7) {
          const twinkle = Math.sin(time * 0.5 + col * 3.7 + row * 2.3) * 0.5 + 0.5;
          const bright = Math.floor(80 + twinkle * 120);
          ch = starVal > 0.997 ? '*' : '.';
          color = [bright, bright, Math.min(255, bright + 40)];
        }

        // Moon glow near upper right
        const moonX = COLS * 0.75, moonY = HORIZON * 0.25;
        const moonDist = Math.sqrt((col - moonX) ** 2 + (row - moonY) ** 2);
        if (moonDist < 2) {
          ch = moonDist < 1 ? 'O' : '·';
          color = [220, 220, 200];
        } else if (moonDist < 10) {
          const glow = 1 - moonDist / 10;
          color = lerpColor(skyColor, [60, 60, 80], glow * 0.4);
        }

        // Horizon glow
        if (row >= HORIZON - 2) {
          const glowT = 1 - (HORIZON - row) / 2;
          const horizGlow = Math.sin(col * 0.05 + time * 0.1) * 0.1 + 0.15;
          color = lerpColor(color, [60, 70, 100], glowT * horizGlow);
        }

        lineChars.push({ ch, color });
      }

    } else {
      // === WATER (3D perspective raycasted) ===
      const screenDist = row - HORIZON;
      const worldZ = (CAM_HEIGHT * FOCAL) / screenDist;
      const perspScale = worldZ / FOCAL;

      for (let col = 0; col < COLS; col++) {
        const worldX = (col - COLS / 2) * perspScale;

        const h = waveHeight(worldX, worldZ, time);
        const slope = waveSlope(worldX, worldZ, time);
        const slopeMag = Math.sqrt(slope.dx ** 2 + slope.dz ** 2);

        // Wave displaces the row slightly (parallax)
        const displaced = h * (1.0 / (1 + worldZ * 0.05));

        // Distance fog factor (0=close, 1=far)
        const distFog = Math.min(1, worldZ / 80);

        // Fresnel-ish: steeper angle at distance = more reflective
        const fresnel = Math.min(1, 0.3 + distFog * 0.7);

        // Lighting: approximate sun reflection
        const sunDir = Math.sin(time * 0.05) * 0.3;
        const specular = Math.max(0, slope.dx * sunDir + slope.dz * 0.5);
        const specPow = Math.pow(specular, 3) * (1 - distFog * 0.5);

        // Character selection based on slope and distance
        let ch;
        const isNearCrest = h > 0.8 && slope.dz < -0.2;
        const isBreaking = h > 1.2 && slopeMag > 0.8 && worldZ < 20;

        if (isBreaking) {
          const i = Math.floor(Math.abs(h * 10 + worldX * 3 + time * 4));
          ch = FOAM_CHARS[i % FOAM_CHARS.length];
        } else if (isNearCrest) {
          const i = Math.floor(Math.abs(worldX * 2 + time * 3));
          ch = CREST_CHARS[i % CREST_CHARS.length];
        } else if (distFog > 0.7) {
          // Far away: very flat
          const i = Math.floor(Math.abs(worldX * 0.5 + worldZ * 0.3 + time));
          ch = slopeMag > 0.3 ? GENTLE_CHARS[i % GENTLE_CHARS.length]
                               : FLAT_CHARS[i % FLAT_CHARS.length];
        } else if (slopeMag > 0.7) {
          const i = Math.floor(Math.abs(h * 8 + worldX * 2 + time * 3));
          ch = STEEP_CHARS[i % STEEP_CHARS.length];
        } else if (slopeMag > 0.3) {
          const i = Math.floor(Math.abs(h * 6 + worldX + time * 2));
          ch = MEDIUM_CHARS[i % MEDIUM_CHARS.length];
        } else {
          const i = Math.floor(Math.abs(h * 4 + worldX * 0.5 + time));
          ch = slopeMag > 0.15 ? GENTLE_CHARS[i % GENTLE_CHARS.length]
                                : FLAT_CHARS[i % FLAT_CHARS.length];
        }

        // Color: blend between deep and bright based on height + specular
        let baseColor;
        const heightNorm = (h + 2) / 4; // normalize roughly to 0-1
        if (heightNorm > 0.7) {
          baseColor = lerpColor(WATER_LIGHT, WATER_BRIGHT, (heightNorm - 0.7) / 0.3);
        } else if (heightNorm > 0.4) {
          baseColor = lerpColor(WATER_MID, WATER_LIGHT, (heightNorm - 0.4) / 0.3);
        } else {
          baseColor = lerpColor(WATER_DEEP, WATER_MID, heightNorm / 0.4);
        }

        // Add specular highlights
        if (specPow > 0.1) {
          baseColor = lerpColor(baseColor, WHITE, specPow * 0.6);
        }

        // Foam on crests
        if (isBreaking) {
          baseColor = lerpColor(baseColor, FOAM_COLOR, 0.7);
        } else if (isNearCrest) {
          baseColor = lerpColor(baseColor, FOAM_COLOR, 0.4);
        }

        // Distance fog towards dark horizon color
        const fogColor = [12, 25, 50];
        baseColor = lerpColor(baseColor, fogColor, distFog * 0.75);

        // Moon reflection on water
        const moonReflX = COLS * 0.75;
        const reflDist = Math.abs(col - moonReflX);
        const reflWidth = 3 + worldZ * 0.15;
        if (reflDist < reflWidth) {
          const reflStrength = (1 - reflDist / reflWidth) * (0.2 + 0.15 * Math.sin(worldZ * 0.5 + time));
          const shimmer = Math.sin(worldX * 2 + worldZ * 0.8 + time * 2) * 0.5 + 0.5;
          baseColor = lerpColor(baseColor, [200, 200, 180], reflStrength * shimmer * 0.6);
          if (reflStrength * shimmer > 0.25 && reflDist < reflWidth * 0.5) {
            ch = shimmer > 0.6 ? '|' : ':';
          }
        }

        lineChars.push({ ch, color: baseColor });
      }
    }

    // Build HTML spans with color runs
    let prevColor = null;
    let span = '';
    for (const { ch, color } of lineChars) {
      const css = `color:rgb(${color[0]},${color[1]},${color[2]})`;
      if (!prevColor || prevColor[0] !== color[0] || prevColor[1] !== color[1] || prevColor[2] !== color[2]) {
        if (prevColor) span += '</span>';
        span += `<span style="${css}">`;
        prevColor = color;
      }
      span += ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '&' ? '&amp;' : ch;
    }
    if (prevColor) span += '</span>';
    html += span + '\n';
  }

  el.innerHTML = html;
}

function loop() {
  t += 0.035;
  render(t);
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
